apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: alltrailstogpx-app
spec:
  secretName: alltrailstogpx-app-tls
  dnsNames:
    - alltrailstogpx.app
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
